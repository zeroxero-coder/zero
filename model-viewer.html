<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>ZERONERO 3D Models</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@v0.153.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@v0.153.0/examples/jsm/"
        }
    }
    </script>

    <style>
        :root{
            --b:#0a0a0a;
            --b5:#2e2e2e;
            --m3:#C13352;
            --w:#f0ebe8;
            --w3:#c9bfba;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            margin:0;
            overflow:hidden;
            background:black;
            font-family:'Tajawal',Arial,sans-serif;
        }

        canvas{
            display:block;
            touch-action:none;
        }

        #topbar{
            position:fixed;
            top:0;
            left:0;
            right:0;
            z-index:10;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:calc(.85rem + env(safe-area-inset-top)) 1rem .85rem;
            background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);
            pointer-events:none;
        }

        #backBtn{
            pointer-events:auto;
            text-decoration:none;
            color:var(--w3);
            border:1px solid var(--b5);
            border-radius:20px;
            padding:7px 14px;
            background:rgba(0,0,0,.55);
            transition:.2s;
        }

        #backBtn:hover{
            color:var(--m3);
            border-color:var(--m3);
        }

        #modelTitle{
            font-family:'Bebas Neue',sans-serif;
            color:var(--w);
            letter-spacing:3px;
            font-size:1.1rem;
        }

        #hint{
            position:fixed;
            left:50%;
            bottom:calc(1rem + env(safe-area-inset-bottom));
            transform:translateX(-50%);
            background:rgba(0,0,0,.6);
            color:var(--w3);
            padding:7px 16px;
            border-radius:20px;
            font-size:.8rem;
            pointer-events:none;
            white-space:nowrap;
            z-index:10;
        }

        #status{
            position:fixed;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            color:var(--w3);
            z-index:20;
            font-size:.95rem;
            text-align:center;
            pointer-events:none;
        }

        #status.error{
            color:var(--m3);
        }
    </style>
</head>

<body>

<div id="topbar">
    <a href="index.html" id="backBtn">← Back</a>
    <div id="modelTitle"></div>
    <div style="width:70px;"></div>
</div>

<div id="hint">
    🖱 Drag to rotate · Scroll to zoom · Two fingers to pan
</div>

<div id="status">
    Loading 3D Model...
</div>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

document.title = "ZERONERO 3D Models";

// قراءة اسم الملف واسم النموذج من الرابط
// model-viewer.html?f=nrdd.glb&n=NRDD

const params = new URLSearchParams(window.location.search);

const modelFile = "phg2.glb";
const modelLabel = "ROOM1";
    
document.getElementById("modelTitle").textContent = modelLabel;

const statusEl = document.getElementById("status");

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000);

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(4,5,11);

// التحكم بالكاميرا

const controls = new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.dampingFactor = 0.05;

controls.enablePan = true;
controls.enableZoom = true;
controls.enableRotate = true;

controls.minDistance = 1;
controls.maxDistance = 100;

controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI;

controls.target.set(0,1,0);

controls.update();

// الإضاءة

// =====================
// Cinematic Lighting
// =====================

// إضاءة رئيسية برتقالية (Key Light)
const keyLight = new THREE.SpotLight(0xff9a3c, 4.5);
keyLight.position.set(-6, 3,3);
keyLight.angle = Math.PI / 6;
keyLight.penumbra = 0.7;
scene.add(keyLight);

// إضاءة رئيسية برتقالية (Key Light)
const keyLight2 = new THREE.SpotLight(0xff9a3c, 4.5);
keyLight2.position.set(9,1,1);
keyLight2.angle = Math.PI / 6;
keyLight2.penumbra = 0.7;
scene.add(keyLight2);

const monitorLight = new THREE.SpotLight(0xcfe8ff, 4);

monitorLight.position.set(0, 1.5, 4);
monitorLight.distance = 30;

scene.add(monitorLight);

// إضاءة تعبئة بنفسجية (Fill Light)
const fillLight = new THREE.SpotLight(0x8a4dff, 2.6);
fillLight.position.set(-18, 15, -20);
fillLight.angle = Math.PI / 5;
fillLight.penumbra = 0.8;
scene.add(fillLight);

// إضاءة خلفية زرقاء داكنة (Rim Light)
const rimLight = new THREE.SpotLight(0x234dff, 3);
rimLight.position.set(0, 20, -35);
rimLight.angle = Math.PI / 4;
rimLight.penumbra = 1;
scene.add(rimLight);

// إضاءة عامة خفيفة جداً
const ambientLight = new THREE.AmbientLight(0x1b2248, 0.28);
scene.add(ambientLight);

// تحميل المجسم

const loader = new GLTFLoader().setPath("models-folder/");

loader.load(

    modelFile,

    (gltf)=>{

        const mesh = gltf.scene;

        mesh.position.set(0,1.05,-1);

        scene.add(mesh);

        statusEl.style.display="none";

    },

    undefined,

    (error)=>{

        console.error(error);

        statusEl.textContent="Failed to load 3D model.";

        statusEl.classList.add("error");

    }

);

// التحريك

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene,camera);

}

animate();

// تغيير حجم الشاشة

window.addEventListener("resize",()=>{

    camera.aspect = window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
