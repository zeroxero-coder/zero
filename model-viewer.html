<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Millennium Falcon</title>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@v0.153.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@v0.153.0/examples/jsm/"
        }
    }
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

<div id="heading">
    <h1>THE MILLENNIUM FALCON</h1>
    <div class="border"></div>
</div>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000);

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(4, 5, 11);

// التحكم بالكاميرا
const controls = new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.dampingFactor = 0.05;

controls.enablePan = true;
controls.enableZoom = true;
controls.enableRotate = true;

controls.minDistance = 1;
controls.maxDistance = 100;

// حرية كاملة تقريبًا
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI;

controls.target.set(0, 1, 0);

controls.update();


// الإضاءة
const spotLight = new THREE.SpotLight(0xffffff, 3);
spotLight.position.set(30, 30, 30);
scene.add(spotLight);

const spotLight2 = new THREE.SpotLight(0xffffff, 3);
spotLight2.position.set(-30, 30, -30);
scene.add(spotLight2);

// إضاءة خفيفة عامة
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);


// تحميل المجسم
const loader = new GLTFLoader().setPath('millennium_falcon/');

loader.load('nrdd.glb', (gltf) => {

    const mesh = gltf.scene;

    mesh.position.set(0, 1.05, -1);

    scene.add(mesh);

});


// التحريك
function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene, camera);

}

animate();


// تغيير حجم الشاشة
window.addEventListener('resize', () => {

    camera.aspect = window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);

});

</script>

</body>
</html>
